services:
  # ── Databases ──────────────────────────────────────────────
  auth-db:
    image: postgres:16-alpine
    container_name: kampusevent-auth-db
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - kampusevent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  event-db:
    image: postgres:16-alpine
    container_name: kampusevent-event-db
    environment:
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_pass
      POSTGRES_DB: event_db
    volumes:
      - event_db_data:/var/lib/postgresql/data
    networks:
      - kampusevent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d event_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  registration-db:
    image: postgres:16-alpine
    container_name: kampusevent-registration-db
    environment:
      POSTGRES_USER: registration_user
      POSTGRES_PASSWORD: registration_pass
      POSTGRES_DB: registration_db
    volumes:
      - registration_db_data:/var/lib/postgresql/data
    networks:
      - kampusevent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registration_user -d registration_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  attendance-db:
    image: postgres:16-alpine
    container_name: kampusevent-attendance-db
    environment:
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_pass
      POSTGRES_DB: attendance_db
    volumes:
      - attendance_db_data:/var/lib/postgresql/data
    networks:
      - kampusevent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Microservices ──────────────────────────────────────────
  auth-service:
    build:
      context: ../kampusevent-auth-service
      dockerfile: Dockerfile
    container_name: kampusevent-auth-service
    ports:
      - "8001:8001"
    environment:
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql://auth_user:auth_pass@auth-db:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_USERS: "true"
    depends_on:
      auth-db:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - kampusevent-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  event-service:
    build:
      context: ../kampusevent-event-service
      dockerfile: Dockerfile
    container_name: kampusevent-event-service
    ports:
      - "8002:8002"
    environment:
      SERVICE_NAME: event-service
      DATABASE_URL: postgresql://event_user:event_pass@event-db:5432/event_db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      event-db:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - kampusevent-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  registration-service:
    build:
      context: ../kampusevent-registration-service
      dockerfile: Dockerfile
    container_name: kampusevent-registration-service
    ports:
      - "8003:8003"
    environment:
      SERVICE_NAME: registration-service
      DATABASE_URL: postgresql://registration_user:registration_pass@registration-db:5432/registration_db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      EVENT_SERVICE_URL: http://event-service:8002
      AUTH_SERVICE_URL: http://auth-service:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      registration-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - kampusevent-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  attendance-service:
    build:
      context: ../kampusevent-attendance-service
      dockerfile: Dockerfile
    container_name: kampusevent-attendance-service
    ports:
      - "8004:8004"
    environment:
      SERVICE_NAME: attendance-service
      DATABASE_URL: postgresql://attendance_user:attendance_pass@attendance-db:5432/attendance_db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      REGISTRATION_SERVICE_URL: http://registration-service:8003
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      attendance-db:
        condition: service_healthy
      registration-service:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - kampusevent-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Observability ──────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: kampusevent-jaeger
    ports:
      - "16687:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - kampusevent-net

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: kampusevent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      auth-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      registration-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
    networks:
      - kampusevent-net

  grafana:
    image: grafana/grafana:10.3.1
    container_name: kampusevent-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - kampusevent-net

networks:
  kampusevent-net:
    driver: bridge

volumes:
  auth_db_data:
  event_db_data:
  registration_db_data:
  attendance_db_data:
  prometheus_data:
  grafana_data:
