worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Rate limiting zones
    # General API: 100 requests/second per IP with burst
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/s;
    # Auth endpoints: stricter 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
    # Login/register: 60 requests/minute per IP (strict but E2E-friendly)
    limit_req_zone $binary_remote_addr zone=api_auth_strict:10m rate=60r/m;

    limit_req_status 429;
    limit_req_log_level warn;

    upstream auth_upstream {
        server auth-service:8001;
    }

    upstream event_upstream {
        server event-service:8002;
    }

    upstream registration_upstream {
        server registration-service:8003;
    }

    upstream attendance_upstream {
        server attendance-service:8004;
    }

    server {
        listen 80;
        server_name localhost;

        # Gateway health
        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx"}';
        }

        # ── Auth Service ──────────────────────────────────────
        location ~ ^/auth/(login|register)$ {
            limit_req zone=api_auth_strict burst=15 nodelay;
            proxy_pass http://auth_upstream/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway-Service auth-service;
        }

        location /auth/ {
            limit_req zone=api_auth burst=20 nodelay;
            proxy_pass http://auth_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway-Service auth-service;
        }

        # ── Event Service ─────────────────────────────────────
        location = /events/health {
            access_log off;
            proxy_pass http://event_upstream/health;
            proxy_set_header Host $host;
        }

        location = /events/metrics {
            access_log off;
            proxy_pass http://event_upstream/metrics;
            proxy_set_header Host $host;
        }

        location /events {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://event_upstream/events;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway-Service event-service;
        }

        # ── Registration Service ──────────────────────────────
        location = /registrations/health {
            access_log off;
            proxy_pass http://registration_upstream/health;
            proxy_set_header Host $host;
        }

        location = /registrations/metrics {
            access_log off;
            proxy_pass http://registration_upstream/metrics;
            proxy_set_header Host $host;
        }

        location /registrations {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://registration_upstream/registrations;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway-Service registration-service;
        }

        # ── Attendance Service ────────────────────────────────
        location = /attendance/health {
            access_log off;
            proxy_pass http://attendance_upstream/health;
            proxy_set_header Host $host;
        }

        location = /attendance/metrics {
            access_log off;
            proxy_pass http://attendance_upstream/metrics;
            proxy_set_header Host $host;
        }

        location /attendance {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://attendance_upstream/attendance;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway-Service attendance-service;
        }
    }
}
