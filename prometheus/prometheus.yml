global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8001"]
    metrics_path: /metrics

  - job_name: event-service
    static_configs:
      - targets: ["event-service:8002"]
    metrics_path: /metrics

  - job_name: registration-service
    static_configs:
      - targets: ["registration-service:8003"]
    metrics_path: /metrics

  - job_name: attendance-service
    static_configs:
      - targets: ["attendance-service:8004"]
    metrics_path: /metrics
